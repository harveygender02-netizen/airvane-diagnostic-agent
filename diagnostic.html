<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Restarting — The Diagnostic | Airvane Sys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f2f0ea;
      --color-surface: #f7f5f0;
      --color-surface-2: #faf9f6;
      --color-border: #ddd9d2;
      --color-divider: #e5e2db;
      --color-text: #1e1c17;
      --color-text-muted: #6b6960;
      --color-text-faint: #a8a69f;
      --color-accent: #3d6b5e;
      --color-accent-hover: #2d5045;
      --color-accent-highlight: #d4e4e0;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', 'Helvetica Neue', sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.25rem);
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); line-height: 1.6; }
    nav { padding: var(--space-6); border-bottom: 1px solid var(--color-divider); text-align: center; }
    .nav-brand { font-family: var(--font-display); font-size: var(--text-base); text-decoration: none; color: inherit; }
    .progress-bar-wrap { background: var(--color-divider); height: 2px; }
    .progress-bar { height: 2px; background: var(--color-accent); width: 0%; transition: width 0.4s; }
    main { max-width: 600px; margin: 0 auto; padding: var(--space-10) var(--space-6); }
    .screen { display: none; }
    .screen.active { display: block; }
    .intro-headline { font-family: var(--font-display); font-size: var(--text-2xl); margin-bottom: var(--space-6); }
    .email-input { width: 100%; padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
    .btn-primary { width: 100%; padding: var(--space-4); background: var(--color-accent); color: white; border-radius: var(--radius-md); cursor: pointer; border: none; font-weight: 500; }
    .options-list { list-style: none; padding: 0; margin: var(--space-6) 0; display: flex; flex-direction: column; gap: var(--space-3); }
    .option-btn { width: 100%; text-align: left; padding: var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); cursor: pointer; }
    .option-btn.selected { background: var(--color-accent-highlight); border-color: var(--color-accent); }
    .nav-btns { display: flex; justify-content: space-between; align-items: center; }
    .btn-back { cursor: pointer; text-decoration: underline; color: var(--color-text-faint); }
  </style>
</head>
<body>
  <nav><a href="/" class="nav-brand">Airvane Sys</a></nav>
  <div class="progress-bar-wrap"><div id="progressBar" class="progress-bar"></div></div>
  <main>
    <div id="screen-intro" class="screen active">
      <h1 class="intro-headline">The Stop Restarting Diagnostic</h1>
      <div id="optInContainer">
        <p style="margin-bottom:1rem">Enter your email to begin the diagnostic.</p>
        <input type="email" id="emailInput" class="email-input" placeholder="you@email.com">
      </div>
      <button class="btn-primary" onclick="startDiagnostic()">Begin the Diagnostic →</button>
    </div>
    <div id="screen-questions" class="screen">
      <div id="questionCounter" style="font-size:var(--text-xs); color:var(--color-text-faint); margin-bottom:1rem"></div>
      <div id="questionText" class="intro-headline" style="font-size:var(--text-xl)"></div>
      <ul id="optionsList" class="options-list"></ul>
      <div class="nav-btns">
        <button id="backBtn" class="btn-back" onclick="goBack()">← Back</button>
        <button id="nextBtn" class="btn-primary" style="width:auto" onclick="goNext()">Continue →</button>
      </div>
    </div>
    <div id="screen-loading" class="screen">
      <p>Reading the pattern...</p>
    </div>
    <div id="screen-result" class="screen">
      <h2 id="resultHeadline" class="intro-headline"></h2>
      <p id="resultBody" style="font-style:italic; color:var(--color-text-muted)"></p>
    </div>
  </main>
  <script>
    const AGENT_ENDPOINT = "https://airvane-diagnostic.harveygender8.workers.dev/webhook";
    const questions = [
      { text: "Before you fully registered that the energy had changed, something was already happening. What was it?", options: ["More information needed researching.", "External conditions needed to be in place.", "The direction felt right but not certain.", "I was just suddenly less present."] },
      { text: "As you were working on it, which sentence arrived first?", options: ["Someone else has already done this better.", "One more thing needs to be right.", "The direction isn't wrong, just needs adjusting.", "It was quieter than that."] },
      { text: "When it ended, which of these was closest to what you felt?", options: ["Clarity.", "Relief.", "Nothing at first.", "I just noticed I was somewhere else."] },
      { text: "Where was most of your attention just before it went quiet?", options: ["On the edges (formatting, etc).", "On other people's work.", "On the same piece of work repeatedly.", "On something new."] },
      { text: "What do you know about what happens next?", options: ["I know exactly what happens on day two.", "I want to see the moment it fires.", "I need something that works in that window.", "I don't know if it will be different."] }
    ];
    let currentQ = 0, answers = [], subscriberEmail = "";
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const emailParam = params.get("email");
      if (emailParam) {
        subscriberEmail = emailParam;
        document.getElementById("optInContainer").style.display = "none";
      }
    })();
    function setProgress(pct) { document.getElementById("progressBar").style.width = pct + "%"; }
    function showScreen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id)); }
    function startDiagnostic() {
      if (!subscriberEmail) {
        const email = document.getElementById("emailInput").value.trim();
        if (!email.includes("@")) return alert("Valid email required");
        subscriberEmail = email;
      }
      currentQ = 0; answers = []; renderQuestion(); showScreen("screen-questions"); setProgress(10);
    }
    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById("questionCounter").textContent = `Question ${currentQ + 1} of ${questions.length}`;
      document.getElementById("questionText").textContent = q.text;
      const list = document.getElementById("optionsList");
      list.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn" + (answers[currentQ] === i ? " selected" : "");
        btn.textContent = opt;
        btn.onclick = () => {
          answers[currentQ] = i;
          document.querySelectorAll(".option-btn").forEach((b, idx) => b.classList.toggle("selected", idx === i));
          document.getElementById("nextBtn").disabled = false;
        };
        const li = document.createElement("li"); li.appendChild(btn); list.appendChild(li);
      });
      document.getElementById("nextBtn").disabled = answers[currentQ] === undefined;
      document.getElementById("backBtn").style.visibility = currentQ === 0 ? "hidden" : "visible";
    }
    function goNext() {
      if (currentQ < questions.length - 1) {
        currentQ++; renderQuestion(); setProgress(10 + (currentQ / questions.length) * 80);
      } else { submitDiagnostic(); }
    }
    function goBack() {
      if (currentQ > 0) {
        currentQ--; renderQuestion(); setProgress(10 + (currentQ / questions.length) * 80);
      }
    }
    async function submitDiagnostic() {
      showScreen("screen-loading"); setProgress(95);
      try {
        const res = await fetch(AGENT_ENDPOINT, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: subscriberEmail, q1: answers[0], q2: answers[1], q3: answers[2], q4: answers[3], q5: answers[4] })
        });
        const data = await res.json();
        document.getElementById("resultHeadline").textContent = data.resultHeadline;
        document.getElementById("resultBody").textContent = data.resultBody;
        showScreen("screen-result");
      } catch (err) {
        document.getElementById("resultHeadline").textContent = "Your loop has a shape.";
        document.getElementById("resultBody").textContent = "The email sequence will name it precisely.";
        showScreen("screen-result");
      }
      setProgress(100);
    }
  </script>
</body>
</html>
